server.port=5007
spring.application.name=llm-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sound_map
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Disable RabbitMQ & Redis for local dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
rabbitmq.enabled=false
redis.enabled=true

# DeepSeek API
llm.api.url=https://api.deepseek.com/v1/chat/completions
llm.api.key=YOUR_DEEPSEEK_API_KEY
llm.model=deepseek-chat
