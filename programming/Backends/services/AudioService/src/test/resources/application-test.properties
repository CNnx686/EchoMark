# RateLimiter
resilience4j.ratelimiter.instances.audioApiRateLimiter.limit-for-period=2
resilience4j.ratelimiter.instances.audioApiRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.audioApiRateLimiter.timeout-duration=0

# CircuitBreaker
resilience4j.circuitbreaker.instances.audioApiCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.audioApiCircuitBreaker.sliding-window-size=2
resilience4j.circuitbreaker.instances.audioApiCircuitBreaker.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.audioApiCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.audioApiCircuitBreaker.wait-duration-in-open-state=30s
