server.port=5003
spring.application.name=audio-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sound_map
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Disable RabbitMQ for local dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
rabbitmq.enabled=false
redis.enabled=true

# Redis API Cache configuration
redis.cache.instances.general.ttl=30
redis.cache.instances.general.per-user=false

# Redis Idempotent configuration
redis.idempotent.instances.audio-upload.expire-seconds=10
redis.idempotent.instances.audio-upload.per-user=true
redis.idempotent.instances.audio-general.expire-seconds=10
redis.idempotent.instances.audio-general.per-user=true

# Disable FFmpeg (not installed locally)
ffmpeg.enabled=false

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Remote storage (local resource server)
storage.server.url=http://localhost:5000
